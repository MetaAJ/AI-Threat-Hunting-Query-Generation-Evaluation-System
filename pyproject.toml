[project]
name = "assignment"
version = "0.1.0"
description = "Natural-language threat hunting query generation and evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.5.5",
    "groq>=1.7.0",
    "pandas>=3.0.5",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
